<!DOCTYPE html>
<html dir="rtl" lang="fa" class="light">
  <head>
    <meta charset="UTF-8" />
    <title>xQuery Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
      rel="stylesheet"
      type="text/css"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>
    <script src="assets/js/config.js"></script>
  </head>
  <body
    class="bg-white dark:bg-gradient-to-b dark:from-forest dark:via-forest-light dark:to-forest-hover font-vazirmatn min-h-screen flex flex-col"
  >
    <header
      class="fixed top-0 left-0 right-0 bg-white/80 dark:bg-forest-light/80 backdrop-blur-sm z-50 shadow-sm"
    >
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
          <h1 class="text-lg font-medium text-primary dark:text-accent-dark">
            صفحه مدیریت
          </h1>
          <div class="flex items-center gap-x-2">
            <div class="hidden md:block relative">
              <input
                type="text"
                id="urlDisplay"
                readonly
                class="w-[200px] lg:w-[300px] bg-white/50 dark:bg-forest-light/50 text-primary/80 dark:text-accent-dark/80 text-sm rounded-lg pr-28 pl-3 py-1.5 border border-primary/10 dark:border-accent-dark/10 focus:outline-none focus:ring-1 focus:ring-primary/20 dark:focus:ring-accent-dark/20"
                style="direction: ltr"
              />
              <div
                class="absolute right-1 top-1/2 -translate-y-1/2 flex items-center gap-x-1"
              >
                <button
                  onclick="window.location.href='/'"
                  class="flex items-center text-primary/70 dark:text-accent-dark/70 hover:text-primary dark:hover:text-accent-dark transition-colors p-1 rounded-md hover:bg-primary/5 dark:hover:bg-accent-dark/5"
                >
                  <svg
                    class="h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
                    />
                  </svg>
                </button>
                <button
                  onclick="copyUrl()"
                  class="flex items-center text-primary/70 dark:text-accent-dark/70 hover:text-primary dark:hover:text-accent-dark transition-colors p-1 rounded-md hover:bg-primary/5 dark:hover:bg-accent-dark/5"
                >
                  <svg
                    class="h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"
                    />
                  </svg>
                </button>
                <button
                  onclick="window.open(panelUrl, '_blank')"
                  class="flex items-center text-primary/70 dark:text-accent-dark/70 hover:text-primary dark:hover:text-accent-dark transition-colors p-1 rounded-md hover:bg-primary/5 dark:hover:bg-accent-dark/5"
                >
                  <svg
                    class="h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"
                    />
                  </svg>
                </button>
              </div>
            </div>
            <div class="md:hidden flex items-center gap-x-1">
              <button
                onclick="window.location.href='/'"
                class="flex items-center text-primary/70 dark:text-accent-dark/70 hover:text-primary dark:hover:text-accent-dark transition-colors p-1 rounded-md hover:bg-primary/5 dark:hover:bg-accent-dark/5"
              >
                <svg
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
                  />
                </svg>
              </button>
              <button
                onclick="copyUrl()"
                class="flex items-center text-primary/70 dark:text-accent-dark/70 hover:text-primary dark:hover:text-accent-dark transition-colors p-1 rounded-md hover:bg-primary/5 dark:hover:bg-accent-dark/5"
              >
                <svg
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"
                  />
                </svg>
              </button>
              <button
                onclick="window.open(panelUrl, '_blank')"
                class="flex items-center text-primary/70 dark:text-accent-dark/70 hover:text-primary dark:hover:text-accent-dark transition-colors p-1 rounded-md hover:bg-primary/5 dark:hover:bg-accent-dark/5"
              >
                <svg
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-grow pt-16">
      <div
        id="loadingScreen"
        class="fixed inset-0 bg-white dark:bg-forest flex items-center justify-center z-40"
      >
        <div class="flex flex-col items-center justify-center">
          <div
            class="animate-spin rounded-full h-16 w-16 border-b-2 border-primary dark:border-accent-dark mb-4"
          ></div>
          <h1 class="text-xl font-medium text-primary dark:text-accent-dark">
            در حال بارگذاری...
          </h1>
          <p class="mt-2 text-sm text-primary/70 dark:text-accent-dark/70">
            لطفاً صبر کنید
          </p>
        </div>
      </div>
      <iframe
        id="panelFrame"
        class="w-full h-[calc(100vh-4rem)]"
        frameborder="0"
        sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
      ></iframe>
    </main>

    <script src="assets/js/panel.js"></script>
  </body>
</html>
