<!DOCTYPE html>
<html dir="rtl" lang="fa">
  <head>
    <meta charset="UTF-8" />
    <title>Error Page</title>
    <meta
      name="title"
      content="Error Page"
      x-bind:content="`${error?.code || ''} ${error?.titleEn || 'Error'}`"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
      rel="stylesheet"
      type="text/css"
    />
    <link href="/assets/css/styles.css" rel="stylesheet" />
    <style>
      [x-cloak] {
        display: none !important;
        visibility: hidden !important;
      }
    </style>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>
    <script
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
      defer
    ></script>
    <script src="/assets/js/config.js"></script>
    <script>
      document.addEventListener("alpine:init", () => {
        Alpine.data("errorHandler", () => ({
          error: null,

          errors: {
            400: {
              code: "400",
              title: "درخواست نامعتبر",
              titleEn: "Bad Request",
              message:
                "درخواست ارسال شده معتبر نمی‌باشد. لطفا مجددا تلاش کنید.",
            },
            401: {
              code: "401",
              title: "عدم دسترسی",
              titleEn: "Unauthorized",
              message:
                "شما مجوز دسترسی به این بخش را ندارید. لطفا وارد حساب کاربری خود شوید.",
            },
            403: {
              code: "403",
              title: "دسترسی ممنوع",
              titleEn: "Forbidden",
              message: "شما اجازه دسترسی به این بخش را ندارید.",
            },
            404: {
              code: "404",
              title: "صفحه مورد نظر یافت نشد",
              titleEn: "Not Found",
              message:
                "صفحه‌ای که به دنبال آن هستید وجود ندارد یا حذف شده است.",
            },
            500: {
              code: "500",
              title: "خطای داخلی سرور",
              titleEn: "Internal Server Error",
              message:
                "متأسفانه خطایی در سرور رخ داده است. لطفا بعدا مجددا تلاش کنید.",
            },
            503: {
              code: "503",
              title: "سرویس در دسترس نیست",
              titleEn: "Service Unavailable",
              message:
                "سرویس موقتاً در دسترس نیست. لطفا چند دقیقه دیگر مجددا تلاش کنید.",
            },
          },

          init() {
            // ابتدا error رو null می‌کنیم تا حالت loading فعال باشد
            this.error = null;

            fetch(window.location.href, { method: "HEAD" })
              .then((response) => {
                const code = response.status.toString();
                this.error = this.errors[code] || this.errors["404"];
                // آپدیت عنوان صفحه
                document.title = `${this.error.code} ${this.error.titleEn}`;
              })
              .catch(() => {
                // در صورت بروز خطا، فرض می‌کنیم 404
                this.error = this.errors["404"];
                document.title = `404 Not Found`;
              });
          },
        }));
      });
    </script>
  </head>

  <body
    x-data="errorHandler()"
    class="bg-white dark:bg-gradient-to-b dark:from-forest dark:via-forest-light dark:to-forest-hover font-vazirmatn min-h-screen flex flex-col"
  >
    <div
      class="absolute inset-x-0 top-0 h-full bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CiAgPHBhdGggZD0iTTYwIDBMMCA2ME02MCA2MEwwIDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzAwMDAwMCIgc3Ryb2tlLW9wYWNpdHk9Ii4wMyIgc3Ryb2tlLXdpZHRoPSIuNSIvPgo8L3N2Zz4=')] dark:bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CiAgPHBhdGggZD0iTTYwIDBMMCA2ME02MCA2MEwwIDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0ZGRkZGRiIgc3Ryb2tlLW9wYWNpdHk9Ii4wMyIgc3Ryb2tlLXdpZHRoPSIuNSIvPgo8L3N2Zz4K')] pointer-events-none"
    ></div>

    <main class="flex-grow flex items-center justify-center p-6">
      <div class="relative w-full max-w-2xl">
        <!-- Loading State -->
        <div
          x-cloak
          x-show="!error"
          class="absolute inset-0 flex items-center justify-center"
        >
          <div class="relative size-16">
            <div
              class="absolute -inset-4 bg-black/15 dark:bg-accent-light/10 rounded-full blur-xl animate-pulse"
            ></div>
            <div
              class="relative size-16 rounded-full border-[3px] border-primary/20 dark:border-accent-light/20 border-t-primary dark:border-t-accent-light animate-spin"
            ></div>
          </div>
        </div>

        <!-- Error Card -->
        <div
          x-cloak
          x-show="error"
          x-transition:enter="transition ease-out duration-300"
          x-transition:enter-start="opacity-0 scale-95"
          x-transition:enter-end="opacity-100 scale-100"
          class="relative bg-gray-600/5 dark:bg-slate-800/5 rounded-2xl p-8 backdrop-blur-md border border-gray-900/05 dark:border-accent-light/10 shadow-2xl shadow-black/10 dark:shadow-accent/5 overflow-hidden"
        >
          <!-- Background Effects -->
          <div
            class="absolute inset-0 bg-gradient-to-br from-primary/5 via-transparent to-accent-dark/5 dark:from-accent-light/10 dark:via-accent/5 dark:to-transparent"
          ></div>

          <!-- Content -->
          <div class="flex flex-col items-center text-center">
            <!-- Error Icon -->
            <div class="relative mb-8 group">
              <img
                class="h-24 w-auto [filter:brightness(0)_saturate(100%)_invert(17%)_sepia(56%)_saturate(489%)_hue-rotate(118deg)_brightness(95%)_contrast(87%)] dark:invert-0 transition-transform duration-300 group-hover:scale-110"
                src="/logo.png"
                alt="xQuery"
              />
              <!-- <div class="absolute -inset-4 bg-primary/5 dark:bg-forest/5 rounded-full blur-2xl transition-opacity duration-300 opacity-0 group-hover:opacity-100"></div> -->
            </div>

            <!-- Error Code -->
            <h1
              class="text-5xl font-bold mb-3 bg-gradient-to-r from-primary via-primary-light to-primary dark:from-gray-300 dark:via-gray-200 dark:to-gray-300 bg-clip-text text-transparent"
              x-text="error.code"
            ></h1>

            <!-- Error Title -->
            <h2
              class="text-2xl font-semibold mb-4 text-primary dark:text-white"
              x-text="error.title"
            ></h2>

            <!-- Error Message -->
            <p
              class="text-lg leading-relaxed text-primary/80 dark:text-white/90 mb-10"
              x-text="error.message"
            ></p>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-4">
              <a
                href="/"
                class="group relative inline-flex items-center justify-center gap-x-2 rounded-xl bg-gradient-to-r from-primary to-primary-light dark:from-accent-light dark:to-accent-light px-8 py-4 text-base font-medium text-white dark:text-forest shadow-lg shadow-primary/20 dark:shadow-accent-light/10 transition-all duration-300 hover:shadow-xl hover:shadow-primary/30 dark:hover:shadow-gray-400/10 hover:scale-105 hover:-translate-y-0.5"
              >
                <div
                  class="absolute inset-0 rounded-xl bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxkZWZzPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik0gMjAgMCBMIDAgMCAwIDIwIiBmaWxsPSJub25lIiBzdHJva2U9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiIHN0cm9rZS13aWR0aD0iMSIvPjwvcGF0dGVybj48L2RlZnM+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0idXJsKCNncmlkKSIvPjwvc3ZnPg==')] dark:bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxkZWZzPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik0gMjAgMCBMIDAgMCAwIDIwIiBmaWxsPSJub25lIiBzdHJva2U9InJnYmEoMCwwLDAsMC4wNSkiIHN0cm9rZS13aWR0aD0iMSIvPjwvcGF0dGVybj48L2RlZnM+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0idXJsKCNncmlkKSIvPjwvc3ZnPg==')] opacity-0 transition-opacity duration-300 group-hover:opacity-100"
                ></div>
                <svg
                  class="size-5 transition-transform duration-300 group-hover:scale-110 group-hover:-translate-x-1"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
                  />
                </svg>
                <span class="relative">بازگشت به صفحه اصلی</span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
